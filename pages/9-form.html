<!DOCTYPE html>
<html lang="sk">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORMULÁR</title>
    <link rel="stylesheet" href="../css/form.css" />
  </head>
  <body>
    <div style="padding: 10px 20px;">
      <a href="../index.html" style="color: #fff; text-decoration: none;">← Späť na prehľad lekcií</a>
    </div>
    <div class="form-main">
      <div class="form-div">
        <form action="9-form.html" method="GET">
          <fieldset>
            <legend>Formulár</legend>

            <p>
              <input type="text" id="meno" name="meno" class="feedback-input" placeholder="Meno" required />
            </p>

            <p>
              <input type="email" id="email" name="email" class="feedback-input" placeholder="Email" required />
            </p>

            <div class="flex">
              <label for="pohlavie">Pohlavie:</label>
              <select id="pohlavie" name="pohlavie">
                <option value="muž">muž</option>
                <option value="žena">žena</option>
              </select>
            </div>

            <div class="flex">
              <label>Vek:</label>
              <input type="radio" id="vek-1" name="vek" value="do10" checked />
              <label for="vek-1">do 10</label>
              <input type="radio" id="vek-2" name="vek" value="do30" />
              <label for="vek-2">11-30</label>
              <input type="radio" id="vek-3" name="vek" value="nad30" />
              <label for="vek-3">31 a viac</label>
            </div>

            <div class="flex">
              <label>Situácia:</label>
              <input type="checkbox" id="situacia-zenaty" name="situacia" value="ženatý" />
              <label for="situacia-zenaty">ženatý</label>
              <input type="checkbox" id="situacia-deti" name="situacia" value="deti" />
              <label for="situacia-deti">deti</label>
              <input type="checkbox" id="situacia-bohaty" name="situacia" value="bohatý" />
              <label for="situacia-bohaty">bohatý</label>
              <input type="checkbox" id="situacia-vs" name="situacia" value="VŠ" />
              <label for="situacia-vs">VŠ</label>
            </div>

            <div class="flex">
              <label for="favFarba">Obľúbená farba:</label>
              <input type="color" id="favFarba" name="favFarba" value="#ff0000" />
            </div>

            <div class="flex">
              <label for="narodeniny">Dátum narodenia:</label>
              <input type="date" id="narodeniny" name="narodeniny" required />
            </div>

            <div class="flex">
              <label for="foto">Fotografia:</label>
              <input type="file" id="foto" name="foto" required />
            </div>

            <p>
              <textarea id="text" name="text" class="feedback-input" placeholder="Komentár"> </textarea>
            </p>

            <div class="submit">
              <input type="submit" id="odoslat" value="ODOSLAŤ" />
              <div class="ease"></div>
            </div>
          </fieldset>
        </form>
      </div>
    </div>
  </body>
</html>
